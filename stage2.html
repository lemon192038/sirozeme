<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const BIOME_NAME = { water: '水域', sand: '砂地', grass: '草原', forest: '森林', rock: '岩場', peak: '山岳' };
const RES_KEYS = ['wood', 'stone', 'iron', 'food', 'gold'];
const RES_ICON = { wood: '🪵', stone: '🪨', iron: '⛓', food: '🌾', gold: '🪙' };
const TAX_RATE = [0, 0.02, 0.05, 0.1];
const TAX_NAME = ['無税', '低', '中', '高'];
// rate = 作業員1人が1秒あたり生産する量, bonus = 一致する地形で×1.5
const BUILDINGS = {
  house:     { name: '小さな家', cost: { wood: 20 }, time: 8, housing: 4, color: 0xc9a27a, roof: 0x9c3b32, h: 2.2 },
  farm:      { name: '農場', cost: { wood: 30 }, time: 10, job: '農民', slots: 3, out: 'food', rate: 0.12, bonus: 'grass', terrain: ['grass', 'sand'], color: 0xd9c25a, roof: 0x7a9a3a, h: 1.2 },
  lumber:    { name: '製材所', cost: { wood: 30 }, time: 10, job: '木こり', slots: 3, out: 'wood', rate: 0.15, bonus: 'forest', terrain: ['grass', 'forest'], color: 0x8a6a3a, roof: 0x5a4028, h: 1.8 },
  quarry:    { name: '採石場', cost: { wood: 40 }, time: 12, job: '石工', slots: 3, out: 'stone', rate: 0.10, terrain: ['rock'], color: 0x9a9a98, roof: 0x6f6f6c, h: 1.4 },
  mine:      { name: '鉄鉱山', cost: { wood: 50, stone: 20 }, time: 15, job: '鉱夫', slots: 3, out: 'iron', rate: 0.06, terrain: ['rock', 'peak'], color: 0x6a6a75, roof: 0x3d3d48, h: 1.6 },
  warehouse: { name: '倉庫', cost: { wood: 60, stone: 30 }, time: 14, storage: 400, color: 0xa88b5a, roof: 0x6b4a2b, h: 2.6 }
};


const WORLD_SIZE = 240;
const WATER_LEVEL = 0;

function hash(ix, iz, seed) {
  let h = ix * 374761393 + iz * 668265263 + seed * 2147483647;
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, z, seed) {
  const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
  const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  const a = hash(ix, iz, seed), b = hash(ix + 1, iz, seed), c = hash(ix, iz + 1, seed), d = hash(ix + 1, iz + 1, seed);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, z, seed, oct = 4) {
  let s = 0, amp = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += vnoise(x * f, z * f, seed + i * 17) * amp; amp *= 0.5; f *= 2; }
  return s;
}

class Terrain {
  constructor(seed = 1234) {
    this.seed = seed;
    this.group = new THREE.Group();
    this.build();
  }

  /** 高さ関数（カメラ・将来の建築判定でも使用）。中心は城用に平坦化。 */
  heightAt(x, z) {
    const n = fbm(x * 0.02, z * 0.02, this.seed);
    const m = Math.pow(fbm(x * 0.012 + 50, z * 0.012 + 50, this.seed + 9), 2.2);
    let h = (n - 0.42) * 26 + m * 60;
    const d = Math.hypot(x, z), flat = 1 - THREE.MathUtils.smoothstep(d, 18, 42);
    h = h * (1 - flat) + 2.2 * flat;
    const edge = THREE.MathUtils.smoothstep(Math.max(Math.abs(x), Math.abs(z)), WORLD_SIZE * 0.4, WORLD_SIZE * 0.5);
    return h * (1 - edge) - 6 * edge;
  }

  biomeAt(x, z, h) {
    const slope = Math.abs(this.heightAt(x + 1.5, z) - h) + Math.abs(this.heightAt(x, z + 1.5) - h);
    if (h < WATER_LEVEL + 0.2) return 'water';
    if (h < WATER_LEVEL + 0.9) return 'sand';
    if (h > 24) return 'peak';
    if (slope > 2.6 || h > 15) return 'rock';
    return fbm(x * 0.05 + 9, z * 0.05 - 4, this.seed + 3) > 0.55 ? 'forest' : 'grass';
  }

  build() {
    const seg = 200, geo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, seg, seg);
    geo.rotateX(-Math.PI / 2);
    const pos = geo.attributes.position, col = new Float32Array(pos.count * 3);
    const palette = {
      water: 0x2f6f8f, sand: 0xd8c48a, grass: 0x6fa04a, forest: 0x4d8a3a, rock: 0x7d7a74, peak: 0xf0f0f4
    };
    const c = new THREE.Color();
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = pos.getZ(i), h = this.heightAt(x, z);
      pos.setY(i, h);
      c.setHex(palette[this.biomeAt(x, z, h)]);
      const j = 0.94 + hash(Math.round(x * 3), Math.round(z * 3), 7) * 0.12; // 色ムラ
      col.set([c.r * j, c.g * j, c.b * j], i * 3);
    }
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.computeVertexNormals();
    const land = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, flatShading: true }));
    land.receiveShadow = true;
    this.land = land;
    this.group.add(land);

    const water = new THREE.Mesh(
      new THREE.PlaneGeometry(WORLD_SIZE * 1.6, WORLD_SIZE * 1.6).rotateX(-Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0x3b86ad, transparent: true, opacity: 0.8, roughness: 0.25, metalness: 0.1 })
    );
    water.position.y = WATER_LEVEL;
    this.group.add(water);

    this.scatter();
    this.buildCastle();
  }

  /** 樹木・岩を InstancedMesh で描画（パフォーマンス要件） */
  scatter() {
    const trees = [], rocks = [];
    let s = 99;
    const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 9000 && trees.length < 2500; i++) {
      const x = (rnd() - 0.5) * WORLD_SIZE * 0.9, z = (rnd() - 0.5) * WORLD_SIZE * 0.9;
      if (Math.hypot(x, z) < 30) continue;
      const h = this.heightAt(x, z), b = this.biomeAt(x, z, h);
      if (b === 'forest' || (b === 'grass' && rnd() < 0.04)) trees.push([x, h, z, 0.8 + rnd() * 0.8]);
      else if ((b === 'rock' || b === 'peak') && rnd() < 0.15) rocks.push([x, h, z, 0.6 + rnd() * 1.6]);
    }
    const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.15, 0.2, 1, 5), new THREE.MeshStandardMaterial({ color: 0x6b4a2b }), trees.length);
    const leaf = new THREE.InstancedMesh(new THREE.ConeGeometry(0.9, 2.4, 6), new THREE.MeshStandardMaterial({ color: 0x2f6e35, flatShading: true }), trees.length);
    const rock = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0), new THREE.MeshStandardMaterial({ color: 0x8a8780, flatShading: true }), rocks.length);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), p = new THREE.Vector3(), e = new THREE.Euler();
    trees.forEach(([x, h, z, k], i) => {
      m.compose(p.set(x, h + 0.5 * k, z), q.identity(), sc.set(k, k, k)); trunk.setMatrixAt(i, m);
      m.compose(p.set(x, h + 1.9 * k, z), q.identity(), sc.set(k, k, k)); leaf.setMatrixAt(i, m);
    });
    rocks.forEach(([x, h, z, k], i) => {
      q.setFromEuler(e.set(rnd() * 3, rnd() * 3, 0));
      m.compose(p.set(x, h + 0.3 * k, z), q, sc.set(k, k * 0.7, k)); rock.setMatrixAt(i, m);
    });
    for (const o of [trunk, leaf, rock]) { o.castShadow = true; o.frustumCulled = false; this.group.add(o); }
    this.counts = { trees: trees.length, rocks: rocks.length };
  }

  /** プレースホルダーの城（STAGE 3 で旗占領・防衛システムに置換予定） */
  buildCastle() {
    const g = new THREE.Group(), h = this.heightAt(0, 0);
    const stone = new THREE.MeshStandardMaterial({ color: 0xb8b2a5, flatShading: true });
    const box = (w, hh, d, x, y, z, mat = stone) => {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, hh, d), mat);
      mesh.position.set(x, y + hh / 2, z); mesh.castShadow = mesh.receiveShadow = true; g.add(mesh);
    };
    const R = 12;
    box(R * 2, 3, 1, 0, 0, -R); box(R * 2, 3, 1, 0, 0, R); box(1, 3, R * 2, -R, 0, 0); box(1, 3, R * 2, R, 0, 0);
    for (const [x, z] of [[-R, -R], [R, -R], [-R, R], [R, R]]) {
      const t = new THREE.Mesh(new THREE.CylinderGeometry(2, 2.3, 6, 10), stone); t.position.set(x, 3, z); t.castShadow = true; g.add(t);
      const r = new THREE.Mesh(new THREE.ConeGeometry(2.6, 2.5, 10), new THREE.MeshStandardMaterial({ color: 0x9c3b32 })); r.position.set(x, 7.2, z); r.castShadow = true; g.add(r);
    }
    box(6, 6, 6, 0, 0, -5); // 城主の館
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 4, 6), new THREE.MeshStandardMaterial({ color: 0x5a4028 }));
    pole.position.set(0, 8, -5); g.add(pole);
    this.flag = new THREE.Mesh(new THREE.PlaneGeometry(2, 1.2, 8, 1), new THREE.MeshStandardMaterial({ color: 0x2b6fd6, side: THREE.DoubleSide }));
    this.flag.position.set(1, 9.4, -5); g.add(this.flag);
    g.position.y = h;
    this.group.add(g);
  }

  update(t) { // 旗のはためき
    if (!this.flag) return;
    const p = this.flag.geometry.attributes.position;
    for (let i = 0; i < p.count; i++) p.setZ(i, Math.sin(t * 4 + p.getX(i) * 3) * 0.12 * (p.getX(i) + 1));
    p.needsUpdate = true;
  }
}


/** アイソメ風の俯瞰カメラ。パン・ズーム・回転（マウス/タッチ/キーボード） */
class CameraController {
  constructor(dom, terrain) {
    this.dom = dom; this.terrain = terrain;
    this.camera = new THREE.PerspectiveCamera(35, 1, 1, 1200);
    this.target = new THREE.Vector3(0, 0, 0);
    this.yaw = Math.PI / 4; this.pitch = THREE.MathUtils.degToRad(52); this.dist = 90;
    this.minDist = 18; this.maxDist = 260;
    this.keys = new Set(); this.ptrs = new Map(); this.last = null;
    this.bind();
    this.apply();
  }
  bind() {
    const d = this.dom;
    d.addEventListener('contextmenu', e => e.preventDefault());
    d.addEventListener('pointerdown', e => { d.setPointerCapture(e.pointerId); this.ptrs.set(e.pointerId, e); this.snap(); this.moved = 0; });
    d.addEventListener('pointermove', e => this.onMove(e));
    const up = e => { this.ptrs.delete(e.pointerId); this.snap(); };
    d.addEventListener('pointerup', e => { if (this.moved < 5 && this.onTap) this.onTap(e); up(e); });
    d.addEventListener('pointercancel', up);
    d.addEventListener('wheel', e => { e.preventDefault(); this.zoom(Math.exp(e.deltaY * 0.001)); }, { passive: false });
    addEventListener('keydown', e => this.keys.add(e.key.toLowerCase()));
    addEventListener('keyup', e => this.keys.delete(e.key.toLowerCase()));
  }
  snap() { // 2点間の状態を記録
    const p = [...this.ptrs.values()];
    this.last = p.length === 2 ? { dist: Math.hypot(p[0].clientX - p[1].clientX, p[0].clientY - p[1].clientY), ang: Math.atan2(p[1].clientY - p[0].clientY, p[1].clientX - p[0].clientX) } : null;
  }
  onMove(e) {
    const prev = this.ptrs.get(e.pointerId); if (!prev) return;
    const dx = e.clientX - prev.clientX, dy = e.clientY - prev.clientY;
    this.moved += Math.abs(dx) + Math.abs(dy);
    this.ptrs.set(e.pointerId, e);
    if (this.ptrs.size === 1) {
      if (e.buttons & 2 || e.shiftKey) { this.yaw -= dx * 0.006; this.pitch = THREE.MathUtils.clamp(this.pitch + dy * 0.004, 0.6, 1.25); }
      else this.pan(-dx, -dy);
    } else if (this.ptrs.size === 2 && this.last) {
      const p = [...this.ptrs.values()];
      const dist = Math.hypot(p[0].clientX - p[1].clientX, p[0].clientY - p[1].clientY);
      const ang = Math.atan2(p[1].clientY - p[0].clientY, p[1].clientX - p[0].clientX);
      this.zoom(this.last.dist / Math.max(dist, 1));
      this.yaw -= ang - this.last.ang;
      this.last = { dist, ang };
    }
  }
  pan(dx, dy) {
    const s = this.dist * 0.0017, sin = Math.sin(this.yaw), cos = Math.cos(this.yaw);
    this.target.x += (dx * cos + dy * sin) * s * -1 * -1;
    this.target.z += (-dx * sin + dy * cos) * s;
    const lim = 110; this.target.x = THREE.MathUtils.clamp(this.target.x, -lim, lim); this.target.z = THREE.MathUtils.clamp(this.target.z, -lim, lim);
  }
  zoom(f) { this.dist = THREE.MathUtils.clamp(this.dist * f, this.minDist, this.maxDist); }
  rotate(a) { this.yaw += a; }
  update(dt) {
    const sp = this.dist * dt * 0.9;
    if (this.keys.has('w')) this.pan(0, -sp / (this.dist * 0.0017));
    if (this.keys.has('s')) this.pan(0, sp / (this.dist * 0.0017));
    if (this.keys.has('a')) this.pan(-sp / (this.dist * 0.0017), 0);
    if (this.keys.has('d')) this.pan(sp / (this.dist * 0.0017), 0);
    if (this.keys.has('q')) this.yaw += dt * 1.5;
    if (this.keys.has('e')) this.yaw -= dt * 1.5;
    this.apply();
  }
  apply() {
    this.target.y = Math.max(this.terrain.heightAt(this.target.x, this.target.z), 0);
    const cp = Math.cos(this.pitch);
    this.camera.position.set(
      this.target.x + Math.sin(this.yaw) * cp * this.dist,
      this.target.y + Math.sin(this.pitch) * this.dist,
      this.target.z + Math.cos(this.yaw) * cp * this.dist);
    this.camera.lookAt(this.target);
  }
}

/** ゲーム内時間：実時間1秒 = ゲーム内1分（24分で1日） */
class TimeManager {
  constructor() { this.minutes = 8 * 60; this.speed = 1; }
  update(dt) { this.minutes += dt * this.speed; }
  get day() { return Math.floor(this.minutes / 1440) + 1; }
  get hour() { return (this.minutes % 1440) / 60; }
  get label() { const h = Math.floor(this.hour), m = Math.floor(this.minutes % 60); return `Day ${this.day} ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`; }
}


class ResourceManager {
  constructor() { this.amt = { wood: 200, stone: 100, iron: 0, food: 150, gold: 100 }; this.cap = 500; }
  add(k, v) { this.amt[k] = Math.min(this.cap, Math.max(0, this.amt[k] + v)); }
  canAfford(c) { return Object.keys(c).every(k => this.amt[k] >= c[k]); }
  pay(c) { for (const k in c) this.amt[k] -= c[k]; }
  refund(c) { for (const k in c) this.add(k, Math.floor(c[k] / 2)); }
  clampAll() { for (const k of RES_KEYS) this.amt[k] = Math.min(this.amt[k], this.cap); }
}



class BuildingManager {
  constructor(game) { this.game = game; this.list = []; this.cells = new Map(); this.nid = 1; this.group = new THREE.Group(); game.scene.add(this.group); }
  byId(id) { return this.list.find(b => b.id === id); }
  at(x, z) { return this.cells.get(Math.round(x / 4) + ',' + Math.round(z / 4)) || null; }
  canPlace(type, x, z) {
    const d = BUILDINGS[type], i = Math.round(x / 4), j = Math.round(z / 4), cx = i * 4, cz = j * 4, t = this.game.terrain;
    if (this.cells.has(i + ',' + j)) return { ok: false, reason: 'すでに建物があります' };
    if (Math.abs(cx) < 15 && Math.abs(cz) < 15) return { ok: false, reason: '城の敷地内には建てられません' };
    if (Math.abs(cx) > 105 || Math.abs(cz) > 105) return { ok: false, reason: 'マップの端です' };
    const h = t.heightAt(cx, cz), biome = t.biomeAt(cx, cz, h);
    if (biome === 'water') return { ok: false, reason: '水上には建てられません' };
    const hs = [[2, 2], [-2, 2], [2, -2], [-2, -2]].map(([a, c]) => t.heightAt(cx + a, cz + c));
    if (Math.max(...hs) - Math.min(...hs) > 2.2) return { ok: false, reason: '傾斜が急すぎます' };
    if (d.terrain && !d.terrain.includes(biome)) return { ok: false, reason: `${d.name}は ${d.terrain.map(k => BIOME_NAME[k]).join('・')} に建てられます（ここは${BIOME_NAME[biome]}）` };
    if (!this.game.res.canAfford(d.cost)) return { ok: false, reason: '資源が足りません' };
    return { ok: true, i, j, cx, cz, h, biome };
  }
  place(type, x, z) {
    const r = this.canPlace(type, x, z); if (!r.ok) return r;
    this.game.res.pay(BUILDINGS[type].cost);
    this.add({ type, x: r.cx, z: r.cz, h: r.h, biome: r.biome, progress: 0, done: false });
    return r;
  }
  add(d) {
    const t = this.game.terrain, h = d.h ?? t.heightAt(d.x, d.z);
    const b = { id: d.id ?? this.nid++, type: d.type, x: d.x, z: d.z, h, biome: d.biome ?? t.biomeAt(d.x, d.z, h), progress: d.progress, done: d.done };
    this.nid = Math.max(this.nid, b.id + 1);
    b.mesh = this.makeMesh(b); this.group.add(b.mesh); this.setProgress(b);
    this.list.push(b); this.cells.set(Math.round(b.x / 4) + ',' + Math.round(b.z / 4), b);
    return b;
  }
  makeMesh(b) {
    const d = BUILDINGS[b.type], g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(3, d.h, 3), new THREE.MeshStandardMaterial({ color: d.color, flatShading: true }));
    body.castShadow = body.receiveShadow = true;
    const roof = new THREE.Mesh(new THREE.ConeGeometry(2.6, 1.6, 4), new THREE.MeshStandardMaterial({ color: d.roof, flatShading: true }));
    roof.rotation.y = Math.PI / 4; roof.position.y = d.h + 0.8; roof.castShadow = true;
    g.add(body, roof); g.position.set(b.x, b.h, b.z); b.body = body; b.roof = roof;
    return g;
  }
  setProgress(b) {
    const d = BUILDINGS[b.type], s = b.done ? 1 : Math.max(0.08, b.progress);
    b.body.scale.y = s; b.body.position.y = d.h * s / 2; b.roof.visible = b.done;
  }
  demolish(b) {
    this.game.res.refund(BUILDINGS[b.type].cost);
    this.group.remove(b.mesh);
    this.list.splice(this.list.indexOf(b), 1);
    this.cells.delete(Math.round(b.x / 4) + ',' + Math.round(b.z / 4));
  }
  housing() { return 6 + this.list.reduce((s, b) => s + (b.done && BUILDINGS[b.type].housing || 0), 0); }
  storage() { return 500 + this.list.reduce((s, b) => s + (b.done && BUILDINGS[b.type].storage || 0), 0); }
  update(dt) {
    for (const b of this.list) if (!b.done) {
      b.progress += dt / BUILDINGS[b.type].time;
      if (b.progress >= 1) { b.done = true; b.progress = 1; this.game.ui.toast(`${BUILDINGS[b.type].name}が完成しました`); }
      this.setProgress(b);
    }
    this.game.res.cap = this.storage(); this.game.res.clampAll();
  }
  serialize() { return this.list.map(b => ({ id: b.id, type: b.type, x: b.x, z: b.z, progress: b.progress, done: b.done })); }
  restore(arr) { for (const d of arr) if (BUILDINGS[d.type]) this.add(d); }
}



const FAM = ['佐藤', '鈴木', '高橋', '田中', '伊藤', '渡辺', '山本', '中村'], GIV = ['太郎', '花子', '健', '愛', '蓮', '結衣', '大輔', '美咲'];
const JOB_COLOR = { '無職': 0xdddddd, '農民': 0xe6d25a, '木こり': 0x7a5a2a, '石工': 0x9a9a9a, '鉱夫': 0x5a6a9a };
const CASTLE_HOME = { id: 'castle', cap: 6, x: 0, z: 8 };
class PopulationManager {
  constructor(game) {
    this.game = game; this.list = []; this.nid = 1; this.tick = 0; this.growth = 0; this.max = 400;
    this.homes = new Map([['castle', CASTLE_HOME]]); this.homeCap = 6;
    this.mesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.25, 0.3, 1.1, 6), new THREE.MeshStandardMaterial({ color: 0xffffff }), this.max);
    this.mesh.count = 0; this.mesh.frustumCulled = false; this.mesh.castShadow = true;
    game.scene.add(this.mesh);
    this._m = new THREE.Matrix4(); this._c = new THREE.Color(); this._q = new THREE.Quaternion(); this._p = new THREE.Vector3(); this._s = new THREE.Vector3(1, 1, 1);
  }
  add(d = {}) {
    const rnd = a => a[Math.floor(Math.random() * a.length)];
    const c = Object.assign({ id: this.nid++, name: rnd(FAM) + rnd(GIV), age: 18 + Math.floor(Math.random() * 14), job: '無職', health: 100, hunger: 20, happy: 70, home: null, work: null, x: (Math.random() - 0.5) * 6, z: 6 + Math.random() * 4 }, d);
    c.ox = (Math.random() - 0.5) * 2; c.oz = (Math.random() - 0.5) * 2; c.atWork = false;
    this.nid = Math.max(this.nid, c.id + 1); this.list.push(c); return c;
  }
  update(dt) {
    const g = this.game, B = g.buildings, hour = g.time.hour, day = hour >= 7 && hour < 18, t = g.terrain;
    this.tick += dt; if (this.tick >= 1) { this.tick -= 1; this.step(); }
    this.mesh.count = Math.min(this.list.length, this.max);
    for (let i = 0; i < this.mesh.count; i++) {
      const c = this.list[i], b = c.work !== null ? B.byId(c.work) : null;
      let tx, tz;
      if (b && b.done && day) { tx = b.x + c.ox; tz = b.z + c.oz; }
      else { const h = this.homes.get(c.home) || CASTLE_HOME; tx = h.x + c.ox; tz = h.z + c.oz; }
      const dx = tx - c.x, dz = tz - c.z, d = Math.hypot(dx, dz), sp = Math.min(d, 4 * dt);
      if (d > 0.01) { c.x += dx / d * sp; c.z += dz / d * sp; }
      c.atWork = !!(b && b.done && day && d < 1.5);
      this._p.set(c.x, t.heightAt(c.x, c.z) + 0.55, c.z);
      this._m.compose(this._p, this._q, this._s); this.mesh.setMatrixAt(i, this._m);
    }
    this.mesh.instanceMatrix.needsUpdate = true;
  }
  step() {
    const g = this.game, B = g.buildings, R = g.res, L = this.list;
    // 住居
    this.homes = new Map([['castle', CASTLE_HOME]]);
    for (const b of B.list) if (b.done && BUILDINGS[b.type].housing) this.homes.set(b.id, { id: b.id, cap: BUILDINGS[b.type].housing, x: b.x, z: b.z });
    const occ = new Map([...this.homes.keys()].map(k => [k, 0]));
    for (const c of L) { const h = this.homes.get(c.home); if (!h || occ.get(c.home) >= h.cap) c.home = null; else occ.set(c.home, occ.get(c.home) + 1); }
    for (const c of L) if (c.home === null) { const h = [...this.homes.values()].find(h => occ.get(h.id) < h.cap); if (h) { c.home = h.id; occ.set(h.id, occ.get(h.id) + 1); } }
    this.homeCap = [...this.homes.values()].reduce((s, h) => s + h.cap, 0);
    // 職
    const wk = new Map();
    for (const c of L) { const b = c.work !== null ? B.byId(c.work) : null; if (!b || !b.done) { c.work = null; c.job = '無職'; } else wk.set(b.id, (wk.get(b.id) || 0) + 1); }
    for (const c of L) if (c.work === null && c.age >= 16) {
      const b = B.list.find(b => b.done && BUILDINGS[b.type].slots && (wk.get(b.id) || 0) < BUILDINGS[b.type].slots);
      if (b) { c.work = b.id; c.job = BUILDINGS[b.type].job; wk.set(b.id, (wk.get(b.id) || 0) + 1); }
    }
    // 生活・生産
    for (const c of L) {
      c.hunger += 0.8;
      if (c.hunger >= 60 && R.amt.food >= 1) { R.amt.food -= 1; c.hunger -= 60; }
      if (c.hunger >= 100) c.health -= 2; else if (c.health < 100) c.health = Math.min(100, c.health + 0.5);
      const target = 70 - g.tax * 6 - (c.hunger > 70 ? 30 : 0) - (c.home === null ? 15 : 0);
      c.happy += (target - c.happy) * 0.1;
      if (c.atWork && c.work !== null) {
        const b = B.byId(c.work), d = BUILDINGS[b.type];
        R.add(d.out, d.rate * (0.5 + c.happy / 100) * (d.bonus && d.bonus === b.biome ? 1.5 : 1));
      }
    }
    R.add('gold', L.length * TAX_RATE[g.tax]);
    // 死亡
    for (const c of L.filter(c => c.health <= 0)) { g.ui.toast(`${c.name}が餓死しました`); L.splice(L.indexOf(c), 1); }
    // 人口増加
    this.growth++;
    if (this.growth >= 12) {
      this.growth = 0;
      const avg = L.length ? L.reduce((s, c) => s + c.happy, 0) / L.length : 70;
      if (L.length < this.homeCap && L.length < this.max && R.amt.food > 10 && avg > 40) { const c = this.add(); g.ui.toast(`${c.name}が移住してきました`); }
    }
    L.forEach((c, i) => { if (i < this.max) this.mesh.setColorAt(i, this._c.setHex(JOB_COLOR[c.job] || 0xdddddd)); });
    if (this.mesh.instanceColor) this.mesh.instanceColor.needsUpdate = true;
  }
  stats() {
    const L = this.list, jobs = {}; for (const c of L) jobs[c.job] = (jobs[c.job] || 0) + 1;
    return { n: L.length, jobs, homeless: L.filter(c => c.home === null).length, happy: L.length ? Math.round(L.reduce((s, c) => s + c.happy, 0) / L.length) : 0 };
  }
  serialize() { return this.list.map(c => ({ id: c.id, name: c.name, age: c.age, job: c.job, health: c.health, hunger: c.hunger, happy: c.happy, home: c.home, work: c.work, x: c.x, z: c.z })); }
  restore(arr) { for (const d of arr) this.add(d); }
}

const KEY = 'koc_save_v1';
const SaveManager = {
  save(g) {
    try { localStorage.setItem(KEY, JSON.stringify({ v: 1, res: g.res.amt, tax: g.tax, min: g.time.minutes, b: g.buildings.serialize(), c: g.pop.serialize() })); } catch (e) { /* 保存不可環境 */ }
  },
  load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } },
  clear() { try { localStorage.removeItem(KEY); } catch (e) {} }
};



class UIManager {
  constructor(game) {
    this.game = game; this.t = 0;
    const $ = this.$ = id => document.getElementById(id);
    this.clock = $('clock'); this.info = $('info'); this.toastEl = $('toast');
    document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => $(b.dataset.t).classList.toggle('closed'));
    $('right').classList.add('closed');
    $('rot-l').onclick = () => game.cam.rotate(Math.PI / 8); $('rot-r').onclick = () => game.cam.rotate(-Math.PI / 8);
    $('zoom-in').onclick = () => game.cam.zoom(0.8); $('zoom-out').onclick = () => game.cam.zoom(1.25);
    const set = $('settings'), q = $('quality'), f = $('fps');
    q.value = game.settings.quality; f.value = String(game.settings.fps);
    $('btn-settings').onclick = () => set.classList.toggle('hidden');
    $('settings-close').onclick = () => set.classList.add('hidden');
    q.onchange = () => { game.settings.quality = q.value; game.saveSettings(); game.applyQuality(); };
    f.onchange = () => { game.settings.fps = +f.value; game.saveSettings(); };
    $('btn-reset').onclick = () => { if (confirm('セーブデータを削除して最初からやり直しますか？')) { game.noSave = true; SaveManager.clear(); location.reload(); } };
    // 建築ボタン
    const bl = $('bld-list');
    for (const [id, d] of Object.entries(BUILDINGS)) {
      const b = document.createElement('button'); b.className = 'bld'; b.dataset.id = id;
      b.textContent = `${d.name}（${Object.entries(d.cost).map(([k, v]) => RES_ICON[k] + v).join(' ')}）`;
      b.onclick = () => this.setMode(game.mode === id ? null : id);
      bl.appendChild(b);
    }
    const tb = $('tax-btns');
    TAX_NAME.forEach((n, i) => { const b = document.createElement('button'); b.className = 'tax'; b.textContent = n; b.onclick = () => { game.tax = i; }; tb.appendChild(b); });
    $('btn-demolish').onclick = () => { const b = game.buildings.byId(game.selId); if (b) { game.buildings.demolish(b); game.selId = null; this.setInfo('解体しました（資源の半分を返還）'); $('btn-demolish').classList.add('hidden'); } };
    $('btn-cancel').onclick = () => this.setMode(null);
  }
  setMode(id) {
    const g = this.game; g.mode = id; g.selId = null;
    this.$('btn-cancel').classList.toggle('hidden', !id); this.$('btn-demolish').classList.add('hidden');
    this.setInfo(id ? `${BUILDINGS[id].name}：建てる場所をタップ` : '地形や建物をタップすると情報を表示します');
  }
  toast(t) { this.toastEl.textContent = t; this.toastEl.classList.remove('hidden'); clearTimeout(this._tt); this._tt = setTimeout(() => this.toastEl.classList.add('hidden'), 2600); }
  setInfo(t) { this.info.textContent = t; }
  update(dt) {
    this.t += dt; if (this.t < 0.25) return; this.t = 0;
    const g = this.game, $ = this.$, R = g.res;
    this.clock.textContent = g.time.label;
    for (const k of ['gold', 'food', 'wood', 'stone', 'iron']) $('r-' + k).textContent = Math.floor(R.amt[k]);
    $('r-pop').textContent = `${g.pop.list.length}/${g.pop.homeCap}`;
    document.querySelectorAll('.bld').forEach(b => b.classList.toggle('active', b.dataset.id === g.mode));
    document.querySelectorAll('.tax').forEach((b, i) => b.classList.toggle('active', i === g.tax));
    const s = g.pop.stats();
    $('pop-stats').innerHTML = `人口 ${s.n}／住居 ${g.pop.homeCap}（家なし ${s.homeless}）<br>平均幸福度 ${s.happy}<br>` +
      Object.entries(s.jobs).map(([j, n]) => `${j} ${n}`).join('／') + `<br>倉庫容量 ${R.cap}　税収 +${(s.n * TAX_RATE[g.tax]).toFixed(1)}/秒`;
    if (g.selId !== null) {
      const b = g.buildings.byId(g.selId);
      if (b) { const d = BUILDINGS[b.type], w = g.pop.list.filter(c => c.work === b.id).length;
        this.setInfo(`${d.name}｜${b.done ? '稼働中' : `建築中 ${Math.floor(b.progress * 100)}%`}${d.slots ? `｜作業員 ${w}/${d.slots}` : ''}${d.housing ? `｜住居 +${d.housing}` : ''}${d.storage ? `｜容量 +${d.storage}` : ''}`);
        $('btn-demolish').classList.remove('hidden'); }
    }
  }
}










const QUALITY = {
  low:   { pixelRatio: 1,   shadows: false, shadowSize: 512 },
  mid:   { pixelRatio: 1.25, shadows: true, shadowSize: 1024 },
  high:  { pixelRatio: 1.75, shadows: true, shadowSize: 2048 },
  ultra: { pixelRatio: 2.5, shadows: true, shadowSize: 4096 }
};

class Game {
  constructor(canvas) {
    this.canvas = canvas;
    const mobile = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && innerWidth < 1400);
    this.settings = Object.assign({ quality: mobile ? 'mid' : 'high', fps: 0 }, JSON.parse(this.load('koc_settings') || '{}'));
    this.renderer = new THREE.WebGLRenderer({ canvas, antialias: this.settings.quality !== 'low' });
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.scene = new THREE.Scene();
    this.scene.fog = new THREE.Fog(0x9cc4e4, 180, 520);
    this.terrain = new Terrain();
    this.scene.add(this.terrain.group);
    this.cam = new CameraController(canvas, this.terrain);
    this.time = new TimeManager();
    this.setupLights();
    this.raycaster = new THREE.Raycaster();
    this.res = new ResourceManager(); this.buildings = new BuildingManager(this); this.pop = new PopulationManager(this);
    this.tax = 1; this.mode = null; this.selId = null; this.saveT = 0; this.noSave = false;
    this.cam.onTap = e => this.pick(e);
    this.ui = new UIManager(this);
    this.initState();
    const flush = () => { if (!this.noSave) SaveManager.save(this); };
    addEventListener('pagehide', flush); document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
    this.applyQuality();
    addEventListener('resize', () => this.resize());
    this.resize();
    this.clock = new THREE.Clock(); this.acc = 0;
  }
  initState() {
    const s = SaveManager.load();
    if (s && s.v === 1) { this.res.amt = s.res; this.tax = s.tax; this.time.minutes = s.min; this.buildings.restore(s.b); this.pop.restore(s.c); this.ui.toast('セーブデータを読み込みました'); }
    else for (let i = 0; i < 5; i++) this.pop.add();
  }
  load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  saveSettings() { try { localStorage.setItem('koc_settings', JSON.stringify(this.settings)); } catch {} }

  setupLights() {
    this.hemi = new THREE.HemisphereLight(0xcfe6ff, 0x5a5a3a, 0.7);
    this.sun = new THREE.DirectionalLight(0xfff2d0, 2.2);
    this.sun.castShadow = true;
    const s = this.sun.shadow.camera; s.left = s.bottom = -90; s.right = s.top = 90; s.near = 1; s.far = 400;
    this.sun.shadow.bias = -0.0005;
    this.scene.add(this.hemi, this.sun, this.sun.target);
  }
  applyQuality() {
    const q = QUALITY[this.settings.quality];
    this.renderer.setPixelRatio(Math.min(devicePixelRatio, q.pixelRatio));
    this.renderer.shadowMap.enabled = q.shadows;
    this.sun.castShadow = q.shadows;
    this.sun.shadow.mapSize.set(q.shadowSize, q.shadowSize);
    if (this.sun.shadow.map) { this.sun.shadow.map.dispose(); this.sun.shadow.map = null; }
    this.scene.traverse(o => { if (o.material) o.material.needsUpdate = true; });
    this.resize();
  }
  resize() {
    this.renderer.setSize(innerWidth, innerHeight, false);
    this.cam.camera.aspect = innerWidth / innerHeight;
    this.cam.camera.updateProjectionMatrix();
  }
  pick(e) {
    this.raycaster.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), this.cam.camera);
    const hit = this.raycaster.intersectObject(this.terrain.land)[0];
    if (!hit) return;
    const { x, y, z } = hit.point;
    if (this.mode) { const r = this.buildings.place(this.mode, x, z); this.ui.toast(r.ok ? '建築を開始しました' : r.reason); return; }
    const bd = this.buildings.at(x, z);
    if (bd) { this.selId = bd.id; return; }
    this.selId = null; this.ui.$('btn-demolish').classList.add('hidden');
    const b = this.terrain.biomeAt(x, z, y);
    const names = { water: '水域（建築不可）', sand: '砂地', grass: '草原', forest: '森林', rock: '岩場', peak: '山岳' };
    this.ui.setInfo(`${names[b]}｜座標 (${x.toFixed(0)}, ${z.toFixed(0)})｜標高 ${y.toFixed(1)}`);
  }
  updateDayNight() {
    const h = this.time.hour, a = ((h - 6) / 12) * Math.PI; // 6時に日の出
    const up = Math.sin(a);
    const t = this.cam.target;
    this.sun.position.set(t.x + Math.cos(a) * 120, Math.max(up, 0.08) * 140 + 20, t.z + 60);
    this.sun.target.position.copy(t);
    this.sun.intensity = 0.15 + Math.max(up, 0) * 2.1;
    this.hemi.intensity = 0.25 + Math.max(up, 0) * 0.55;
    const day = new THREE.Color(0x9cc4e4), night = new THREE.Color(0x0b1226), dusk = new THREE.Color(0xe59a6a);
    const sky = night.clone().lerp(day, THREE.MathUtils.clamp(up * 2 + 0.2, 0, 1));
    if (Math.abs(up) < 0.25) sky.lerp(dusk, 0.35 * (1 - Math.abs(up) / 0.25));
    this.scene.background = sky; this.scene.fog.color.copy(sky);
  }
  start() {
    let accRender = 0;
    const loop = () => {
      requestAnimationFrame(loop);
      const dt = Math.min(this.clock.getDelta(), 0.1);
      accRender += dt;
      const lim = this.settings.fps ? 1 / this.settings.fps : 0;
      if (accRender < lim - 0.002) return;
      const step = accRender; accRender = 0;
      this.time.update(step);
      this.cam.update(step);
      this.terrain.update(this.clock.elapsedTime);
      this.buildings.update(step); this.pop.update(step);
      this.saveT += step; if (this.saveT > 15) { this.saveT = 0; if (!this.noSave) SaveManager.save(this); }
      this.updateDayNight();
      this.ui.update(step);
      this.renderer.render(this.scene, this.cam.camera);
    };
    loop();
  }
}



try {
  const game = new Game(document.getElementById('view'));
  game.start();
  window.__game = game; // デバッグ用

  console.error(e);
  document.getElementById('loading').textContent = '初期化に失敗しました: ' + e.message;
} finally {
  setTimeout(() => document.getElementById('loading')?.classList.add('done'), 300);
}
